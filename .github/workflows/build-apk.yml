name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Gradle project
        run: |
          chmod +x gradlew
          # These two Kotlin-DSL files belong to an unrelated Java stub in the original archive.
          # Removing them only in the CI workspace avoids Gradle project-discovery ambiguity.
          rm -f build.gradle.kts settings.gradle.kts

      - name: Build debug and release APKs
        run: ./gradlew clean assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: AdPurge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AdPurge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
