plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ads.purge'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.ads.purge"
        minSdk 24
        targetSdk 34
        versionCode 50
        versionName "5.0"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias 'adpurge'
            keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: ''
            // ★ 显式开启 v1+v2+v3：AGP 8 对 minSdk>=24 默认只签 v2，
            //   旧版签名查看工具只认 v1 会报错，这里三重全开兼容所有工具与设备
            v1SigningEnabled true
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // ★ 正式发布证书签名（release.keystore，密码见根目录 gradle.properties）
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    
    
    packagingOptions {
        resources {
            excludes += [
                    'META-INF/*.SF',
                    'META-INF/*.DSA',
                    'META-INF/*.RSA',
                    'META-INF/INDEX.LIST',
                    'META-INF/DEPENDENCIES',
                    'META-INF/io.netty.versions.properties',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.20-RC2'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    
    implementation 'org.smali:baksmali:2.5.2'
    implementation 'org.smali:smali:2.5.2'
    implementation 'org.smali:dexlib2:2.5.2'
    
    implementation 'com.google.guava:guava:27.1-android'

    
    implementation 'com.android.tools.build:apksig:8.1.0'

    
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
}
